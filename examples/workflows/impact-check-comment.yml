# OPTIONAL and NOT TESTED against GitHub in the alpha. Posts the Impact Check report as a PR comment.
#
# Why a separate workflow: the analysis workflow runs on `pull_request` with a read-only token (safe for forks).
# Commenting needs `pull-requests: write`, which fork PR runs never get. This `workflow_run` workflow runs in the
# base repository context, but it treats the artifact as UNTRUSTED (a fork PR can change the analysis workflow):
#   1. It never checks out or runs PR code.
#   2. It re-renders Markdown from the JSON artifact with a pinned Impact Check release (`impact-check render`),
#      which validates the JSON structure and escapes every string again.
#   3. It takes the PR number from the artifact but only comments after verifying that the PR's head SHA and head
#      repository match the triggering workflow run.
name: Impact Check comment

on:
  workflow_run:
    workflows: ["Impact Check"]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # download the artifact of the triggering run
      pull-requests: write # create/update one comment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: impact-check-report
          path: untrusted-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Pinned exact version from the npm registry (not from the PR). --ignore-scripts prevents install scripts.
      - name: Re-render report with a trusted Impact Check
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund @enwithai/impact-check@0.2.0-alpha.1
          npx --no-install impact-check render --input untrusted-report/impact-check-report.json --output comment.md
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("comment.md", "utf8").slice(0, 60000);
            const { owner, repo } = context.repo;
            // Find the PR for this exact head SHA instead of trusting a number from the artifact.
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: "open", per_page: 100 });
            const pr = prs.find((p) => p.head.sha === process.env.HEAD_SHA && p.head.repo?.full_name === process.env.HEAD_REPO);
            if (!pr) { core.notice("No open PR matches the triggering run; not commenting."); return; }
            const marker = "<!-- impact-check-report -->";
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === "Bot" && c.body?.startsWith(marker));
            const text = `${marker}\n${body}`;
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: text });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: text });
