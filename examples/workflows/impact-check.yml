# Example: copy to .github/workflows/impact-check.yml in your repository.
# Produces a job summary and a `impact-check-report` artifact on every pull request.
# Least privilege: read-only token, no secrets, works for fork PRs, never runs PR code.
name: Impact Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  impact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base must be available
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Replace <RELEASE_COMMIT_SHA> with the full commit SHA of an Impact Check release tag (do not use a branch).
      - id: impact-check
        uses: EnWithAI/impact-check@<RELEASE_COMMIT_SHA> # v0.1.0-alpha.0
        with:
          fail-on-policy: "false" # set "true" to fail the job on confirmed broken imports (default policy)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: impact-check-report
          path: impact-check-report/
          retention-days: 14
