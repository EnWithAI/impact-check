openapi: 3.1.0
info:
  title: Search
  version: 1.0.0
paths:
  /search:
    post:
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [asc, desc]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum:
                    - all
                    - title
                    - tags
      responses:
        "200":
          description: ok
