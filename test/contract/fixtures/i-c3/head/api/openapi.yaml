openapi: 3.0.3
info:
  title: Users
  version: 1.0.0
paths:
  /users:
    get:
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
        - name: tenant
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ok
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: created
components:
  schemas:
    NewUser:
      type: object
      required:
        - email
        - name
        - role
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
